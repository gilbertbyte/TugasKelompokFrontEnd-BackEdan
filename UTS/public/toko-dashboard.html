<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Toko — Pisang Ijo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .dash-wrap{max-width:640px;margin:0 auto;padding:48px 24px 80px;}
  .dash-card{background:var(--white);border:1px solid #EAE3D6;border-radius:var(--radius-lg);padding:32px;margin-bottom:24px;}
  .dash-field{margin-bottom:16px;}
  .dash-field label{display:block;font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .dash-field input,.dash-field textarea{
    width:100%;padding:11px 14px;border-radius:8px;border:1px solid #DCD4C4;
    font-family:var(--font-body);font-size:0.95rem;
  }
  .dash-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .dash-msg{font-size:0.88rem;margin-top:14px;padding:12px 14px;border-radius:8px;display:none;}
  .dash-msg.show{display:block;}
  .dash-msg.ok{background:var(--green-tint);color:var(--green-dark);}
  .dash-msg.err{background:var(--pink);color:var(--pink-text);}
  .review-item{border-bottom:1px solid #EAE3D6;padding:14px 0;}
  .review-item:last-child{border-bottom:none;}
  .review-item .stars{color:var(--mustard-dark);font-size:0.85rem;}

  /* Image manager (multi-upload) */
  .img-manager{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
  .img-manager-item{
    position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;
    border:1px solid #EAE3D6;background:#F4EEE1;
  }
  .img-manager-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-manager-remove{
    position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
    background:rgba(18,51,40,.75);color:#fff;border:none;font-size:0.85rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .img-manager-remove:hover{background:var(--pink-text);}
  .img-manager-cover{
    position:absolute;bottom:4px;left:4px;background:rgba(18,51,40,.75);color:#fff;
    font-size:0.62rem;font-weight:700;padding:2px 6px;border-radius:999px;
  }
  .img-manager-add{
    width:92px;height:92px;border-radius:10px;border:2px dashed var(--mustard);
    background:#FFF9EE;color:var(--mustard-dark);font-size:0.78rem;font-weight:600;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    cursor:pointer;
  }
  .img-manager-add .plus{font-size:1.4rem;line-height:1;}
  .img-manager-add:hover{background:#FCEBD1;}
  .img-manager-add:disabled{opacity:.6;cursor:not-allowed;}
  .img-manager-hint{font-size:0.78rem;color:var(--text-muted);margin:-6px 0 16px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">Pisang Ijo</a>
    <div class="admin-user" style="display:flex;align-items:center;gap:14px;">
      <span id="dashWhoami" style="color:#D9E6DE;font-size:0.9rem;"></span>
      <button class="btn btn-outline-light" id="dashLogoutBtn">Logout</button>
    </div>
  </div>
</header>

<section class="dash-wrap">
  <h2>Dashboard Toko</h2>
  <p class="section-sub" style="margin-bottom:24px;">Kelola informasi toko kamu di sini.</p>

  <div class="dash-card">
    <h3 style="margin-bottom:18px;">Informasi Toko</h3>

    <label style="display:block;font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:8px;">Gambar Toko</label>
    <div class="img-manager" id="imgManager">
      <button type="button" class="img-manager-add" id="imgManagerAddBtn">
        <span class="plus">+</span>
        <span>Tambah</span>
      </button>
    </div>
    <p class="img-manager-hint">Bisa pilih beberapa gambar sekaligus. Gambar pertama jadi sampul. Maks 3MB per gambar (JPG/PNG/WEBP).</p>
    <input type="file" id="storeImageInput" accept="image/jpeg,image/png,image/webp" multiple style="display:none;">

    <form id="storeForm">
      <div class="dash-field">
        <label for="storeNama">Nama Toko</label>
        <input type="text" id="storeNama" required>
      </div>
      <div class="dash-field">
        <label for="storeAlamat">Alamat</label>
        <textarea id="storeAlamat" rows="2"></textarea>
      </div>
      <div class="dash-row">
        <div class="dash-field">
          <label for="storeJamBuka">Jam Buka</label>
          <input type="time" id="storeJamBuka">
        </div>
        <div class="dash-field">
          <label for="storeJamTutup">Jam Tutup</label>
          <input type="time" id="storeJamTutup">
        </div>
      </div>

      <button type="submit" class="btn btn-mustard" style="width:100%;">Simpan Perubahan</button>
      <div class="dash-msg" id="dashMsg"></div>
    </form>
  </div>

  <div class="dash-card">
    <h3 style="margin-bottom:18px;">Ulasan Masuk</h3>
    <div id="reviewsList"><p class="section-sub">Memuat ulasan...</p></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
  var STORE_IMAGES = []; // array url string, urutan = urutan tampil, index 0 = sampul

  function escapeHtml(str) {
    return $("<div>").text(str == null ? "" : str).html();
  }

  function parseImages(raw) {
    if (!raw) return [];
    if (Array.isArray(raw)) return raw.filter(Boolean);
    try {
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.filter(Boolean) : (raw ? [raw] : []);
    } catch (e) {
      return raw ? [raw] : [];
    }
  }

  function renderImageManager() {
    var $manager = $("#imgManager");
    $manager.find(".img-manager-item").remove();

    STORE_IMAGES.forEach(function (url, idx) {
      var $item = $(
        '<div class="img-manager-item">' +
          '<img src="' + escapeHtml(url) + '" alt="Gambar toko ' + (idx + 1) + '">' +
          (idx === 0 ? '<span class="img-manager-cover">Sampul</span>' : '') +
          '<button type="button" class="img-manager-remove" data-idx="' + idx + '" title="Hapus gambar">&times;</button>' +
        '</div>'
      );
      $item.insertBefore("#imgManagerAddBtn");
    });
  }

  $(document).on("click", ".img-manager-remove", function () {
    var idx = $(this).data("idx");
    STORE_IMAGES.splice(idx, 1);
    renderImageManager();
  });

  $("#imgManagerAddBtn").on("click", function () {
    $("#storeImageInput").trigger("click");
  });

  $("#storeImageInput").on("change", function () {
    var files = Array.from(this.files || []);
    if (!files.length) return;

    var $msg = $("#dashMsg");
    $msg.removeClass("show ok err");

    var $addBtn = $("#imgManagerAddBtn");
    $addBtn.prop("disabled", true).html('<span class="plus">⏳</span><span>Mengupload...</span>');

    var uploads = files.map(function (file) {
      var formData = new FormData();
      formData.append("image", file);
      return $.ajax({
        url: "/api/toko/upload",
        method: "POST",
        data: formData,
        processData: false,
        contentType: false,
      });
    });

    $.when.apply($, uploads)
      .done(function () {
        var results = uploads.length === 1 ? [arguments] : arguments;
        Array.prototype.forEach.call(results, function (res) {
          var data = res[0];
          if (data && data.url) STORE_IMAGES.push(data.url);
        });
        renderImageManager();
      })
      .fail(function () {
        $msg.addClass("show err").text("Sebagian atau semua gambar gagal diupload. Coba lagi.");
      })
      .always(function () {
        $addBtn.prop("disabled", false).html('<span class="plus">+</span><span>Tambah</span>');
        $("#storeImageInput").val("");
      });
  });

  // Guard: pastikan yang buka halaman ini memang akun toko yang sudah approved.
  $.getJSON("/api/user/me")
    .done(function (data) {
      if (!data.loggedIn || data.role !== "toko" || data.status !== "approved") {
        window.location.href = "/";
        return;
      }
      $("#dashWhoami").text("Halo, " + data.nama);
      loadStore();
      loadReviews();
    })
    .fail(function () {
      window.location.href = "/";
    });

  $("#dashLogoutBtn").on("click", function () {
    $.post("/api/user/logout").always(function () {
      window.location.href = "/";
    });
  });

  function loadStore() {
    $.getJSON("/api/toko/me").done(function (data) {
      var s = data.store || {};
      $("#storeNama").val(s.nama || "");
      $("#storeAlamat").val(s.alamat || "");
      $("#storeJamBuka").val(s.jam_buka || "");
      $("#storeJamTutup").val(s.jam_tutup || "");

      STORE_IMAGES = parseImages(s.image_url);
      renderImageManager();
    });
  }

  function loadReviews() {
    $.getJSON("/api/toko/testimonials").done(function (rows) {
      var $list = $("#reviewsList").empty();
      if (!rows.length) {
        $list.append('<p class="section-sub">Belum ada ulasan masuk.</p>');
        return;
      }
      rows.forEach(function (r) {
        var starCount = Number(r.stars) || 5;
        var stars = "★".repeat(starCount) + "☆".repeat(5 - starCount);
        var statusLabel = Number(r.approved) === 1 ? "" : ' <span style="color:#C9852A;">(menunggu approval admin)</span>';
        $list.append(
          '<div class="review-item">' +
            '<div class="stars">' + stars + '</div>' +
            '<strong>' + escapeHtml(r.nama) + '</strong>' + statusLabel +
            '<p style="margin:6px 0 0;">' + escapeHtml(r.ulasan) + '</p>' +
            '<p class="section-sub" style="margin:4px 0 0;font-size:0.8rem;">' + escapeHtml(r.waktu) + '</p>' +
          '</div>'
        );
      });
    });
  }

  $("#storeForm").on("submit", function (e) {
    e.preventDefault();
    var $msg = $("#dashMsg");
    $msg.removeClass("show ok err");

    var payload = {
      nama: $("#storeNama").val().trim(),
      alamat: $("#storeAlamat").val().trim(),
      jam_buka: $("#storeJamBuka").val(),
      jam_tutup: $("#storeJamTutup").val(),
      images: STORE_IMAGES,
    };

    $.ajax({
      url: "/api/toko/me",
      method: "PUT",
      contentType: "application/json",
      data: JSON.stringify(payload),
    })
      .done(function () {
        $msg.addClass("show ok").text("Perubahan tersimpan.");
        loadStore();
      })
      .fail(function (xhr) {
        var err = (xhr.responseJSON && xhr.responseJSON.error) || "Gagal menyimpan.";
        $msg.addClass("show err").text(err);
      });
  });
</script>

</body>
</html>
