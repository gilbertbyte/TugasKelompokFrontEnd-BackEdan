<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar sebagai Toko — Pisang Ijo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .auth-wrap{max-width:460px;margin:0 auto;padding:60px 24px;}
  .auth-card{background:var(--white);border:1px solid #EAE3D6;border-radius:var(--radius-lg);padding:36px;}
  .auth-field{margin-bottom:16px;}
  .auth-field label{display:block;font-size:0.82rem;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
  .auth-field input,.auth-field textarea{
    width:100%;padding:11px 14px;border-radius:8px;border:1px solid #DCD4C4;
    font-family:var(--font-body);font-size:0.95rem;
  }
  .auth-msg{font-size:0.88rem;margin-top:14px;padding:12px 14px;border-radius:8px;display:none;}
  .auth-msg.show{display:block;}
  .auth-msg.ok{background:var(--green-tint);color:var(--green-dark);}
  .auth-msg.err{background:var(--pink);color:var(--pink-text);}
  .auth-submit{width:100%;margin-top:6px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">Pisang Ijo</a>
  </div>
</header>

<section class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow-mustard">Gabung Jadi Mitra</span>
    <h2>Daftarkan Toko Kamu</h2>
    <p class="section-sub" style="margin-bottom:24px;">
      Isi data di bawah ini. Setelah dikirim, pendaftaran akan ditinjau admin sebelum toko kamu tampil di platform.
    </p>

    <form id="registerTokoForm">
      <div class="auth-field">
        <label for="nama">Nama Kamu</label>
        <input type="text" id="nama" name="nama" required>
      </div>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="auth-field">
        <label for="password">Password (min. 8 karakter)</label>
        <input type="password" id="password" name="password" minlength="8" required>
      </div>
      <div class="auth-field">
        <label for="nama_toko">Nama Toko</label>
        <input type="text" id="nama_toko" name="nama_toko" required>
      </div>
      <div class="auth-field">
        <label for="alamat">Alamat Toko</label>
        <textarea id="alamat" name="alamat" rows="3"></textarea>
      </div>

      <button type="submit" class="btn btn-mustard auth-submit">Kirim Pendaftaran</button>
      <div class="auth-msg" id="authMsg"></div>
    </form>
  </div>
</section>

<script>
  const form = document.getElementById("registerTokoForm");
  const msg = document.getElementById("authMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "auth-msg";
    const payload = Object.fromEntries(new FormData(form).entries());

    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;

    try {
      const res = await fetch("/api/user/register-toko", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        msg.textContent = data.error || "Pendaftaran gagal, coba lagi.";
        msg.className = "auth-msg err show";
        return;
      }

      msg.textContent = data.message;
      msg.className = "auth-msg ok show";
      form.reset();
    } catch (err) {
      msg.textContent = "Terjadi kesalahan jaringan. Coba lagi.";
      msg.className = "auth-msg err show";
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
